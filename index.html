<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ellen & Eric</title>

  <style>

    body {
      margin: 0;
      background-color: #FFECA2;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      font-family: sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      position: relative;
    }

    .container img {
      width: 100%;
      display: block;
    }

    .button-container {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
    }

    .osa-button {
      background-color: #b22222;
      color: #A8BBCC;
      padding: 15px 32px;
      font-size: 18px;
      border-radius: 10px;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.3s ease;
      white-space: nowrap;
    }

    .osa-button:hover {
      background-color: #8b1a1a;
    }

    /* =========================
       MOBILVERSION
    ========================== */

    @media (max-width: 768px) {

      .container {
        overflow: hidden;
      }

      .container img {
        width: 155%;
        margin-left: -27%;
      }

      .button-container {
        bottom: 10%;
      }

      .osa-button {
        font-size: 8px;
        padding: 6px 15px;
        border-radius: 5px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <!-- Byt till exakt ditt filnamn -->
    <img src="bild.png" alt="Bröllopsinbjudan">

    <div class="button-container">
      <a 
        class="osa-button" 
        href="https://forms.gle/tPSdUk7HjWFcnBFC7" 
        target="_blank" 
        rel="noopener noreferrer"
      >
        OSA här
      </a>
    </div>

  </div>

</body>
</html>
